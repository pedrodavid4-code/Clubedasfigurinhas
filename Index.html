      font-size: 1.5rem;

      font-weight: 600;

      text-decoration: none;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn:hover {
      background-color: #0284c7;
      color: #fff;
      transform: translateY(-2px);
    }

    footer {
      background-color: #1e293b;
      text-align: center;
      padding: 1rem;
      font-size: 0.875rem;
