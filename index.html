<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube das Figurinhas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#171717}
header{background:#111827;color:#fff;padding:18px 5%;position:sticky;top:0;z-index:10}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;max-width:1200px;margin:auto}
.logo{font-size:23px;font-weight:800}
.logo span{color:#facc15}
.cart{background:#facc15;color:#111;padding:10px 15px;border-radius:10px;font-weight:700;cursor:pointer;border:0}
.hero{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:48px 5%}
.hero-inner{max-width:1200px;margin:auto}
.hero h1{font-size:42px;margin:0 0 10px}
.hero p{font-size:18px;color:#d1d5db;margin-bottom:25px}
.search{width:100%;max-width:650px;padding:15px;border:0;border-radius:12px;font-size:16px}
main{max-width:1200px;margin:30px auto;padding:0 5%}
.cats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.cat{border:0;background:#fff;padding:11px 17px;border-radius:20px;cursor:pointer;box-shadow:0 2px 8px #0001}
.cat.active{background:#111827;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 15px #00000010;border:1px solid #eceff3}
.pic{height:250px;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px}
.pic img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.info{padding:15px}
.code{display:inline-block;background:#111827;color:#fff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
.info h3{margin:10px 0 6px;font-size:18px}
.meta{font-size:13px;color:#6b7280;line-height:1.5}
.price{font-size:21px;font-weight:800;margin:12px 0 6px}
.stock{font-size:13px;color:#2563eb;font-weight:700;margin-bottom:12px}
.buy{width:100%;border:0;background:#16a34a;color:#fff;padding:12px;border-radius:9px;font-weight:700;cursor:pointer}
.buy:hover{filter:brightness(.95)}
.empty{grid-column:1/-1;background:#fff;border-radius:15px;padding:28px;text-align:center;color:#6b7280}
footer{margin-top:50px;background:#111827;color:#fff;padding:30px;text-align:center}
#toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:14px 18px;border-radius:10px;display:none;z-index:30}
.drawer{position:fixed;top:0;right:0;width:min(420px,100%);height:100%;background:#fff;z-index:25;box-shadow:-10px 0 40px #0004;transform:translateX(105%);transition:.25s;padding:20px;overflow:auto}
.drawer.open{transform:none}
.drawer h2{margin-top:0}
.close{float:right;border:0;background:#111827;color:white;border-radius:8px;padding:8px 10px;cursor:pointer}
.cart-line{padding:12px 0;border-bottom:1px solid #e5e7eb}
.cart-line b{display:block}
.remove{border:0;background:#fee2e2;color:#991b1b;border-radius:7px;padding:6px 8px;cursor:pointer;margin-top:7px}
.total{font-size:23px;font-weight:800;margin:20px 0}
.checkout{width:100%;border:0;background:#facc15;color:#111;padding:14px;border-radius:10px;font-weight:800;cursor:pointer}
@media(max-width:600px){
 .hero{padding:34px 5%} .hero h1{font-size:34px}
 .logo{font-size:19px} .cart{padding:9px 12px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .pic{height:190px} .info{padding:11px} .info h3{font-size:15px}
 .price{font-size:18px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">⚽ <span>CLUBE DAS</span> FIGURINHAS</div>
    <button class="cart" onclick="verCarrinho()">🛒 Carrinho (<span id="count">0</span>)</button>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Encontre sua figurinha</h1>
    <p>Pesquise pelo número, jogador ou seleção. As figurinhas de 2026 já estão com foto, estoque e preço.</p>
    <input id="search" class="search" placeholder="🔎 Ex.: QAT 8, Alemanha, Ryan Gravenberch..." oninput="render()">
  </div>
</section>

<main>
  <div class="cats">
    <button class="cat active" onclick="categoria('Todos',this)">Todos</button>
    <button class="cat" onclick="categoria('Copa 2026',this)">🏆 Copa 2026</button>
    <button class="cat" onclick="categoria('Adrenalyn',this)">🃏 Adrenalyn</button>
    <button class="cat" onclick="categoria('Extra Stickers',this)">⭐ Extra Stickers</button>
  </div>
  <div id="grid" class="grid"></div>
</main>

<footer>
  <strong>CLUBE DAS FIGURINHAS</strong><br><br>
  Pedidos pelo WhatsApp • Enviamos para todo o Brasil
</footer>

<div id="toast"></div>

<aside id="drawer" class="drawer">
  <button class="close" onclick="fecharCarrinho()">✕</button>
  <h2>Seu carrinho</h2>
  <div id="cartItems"></div>
  <div id="total" class="total">Total: R$ 0,00</div>
  <button class="checkout" onclick="finalizarWhatsApp()">FINALIZAR PELO WHATSAPP</button>
</aside>

let filtro="Todos",carrinho=[];

function brl(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}

function categoria(c,el){
  filtro=c;
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render(){
  let q=document.getElementById('search').value.toLowerCase().trim();
  let lista=produtos.filter(p=>{
    const bateCategoria = filtro==="Todos" || p.colecao===filtro;
    const texto=(p.nome+" "+p.codigo+" "+p.jogador+" "+p.pais+" "+p.colecao).toLowerCase();
    return bateCategoria && texto.includes(q);
  });

  if(!lista.length){
    document.getElementById('grid').innerHTML='<div class="empty">Nenhum item cadastrado nesta área ainda.</div>';
    return;
  }

  document.getElementById('grid').innerHTML=lista.map(p=>`
    <article class="card">
      <div class="pic"><img src="${p.img}" alt="${p.nome}"></div>
      <div class="info">
        <span class="code">${p.codigo} • 2026</span>
        <h3>${p.jogador}</h3>
        <div class="meta">${p.pais}<br>${p.colecao}</div>
        <div class="price">${brl(p.preco)}</div>
        <div class="stock">${p.estoque} unidades disponíveis</div>
        <button class="buy" onclick="add(${p.id})">Adicionar ao carrinho</button>
      </div>
    </article>`).join('');
}

function add(id){
  const p=produtos.find(x=>x.id===id);
  const linha=carrinho.find(x=>x.id===id);
  const atual=linha?linha.qtd:0;
  if(atual>=p.estoque){toast('Quantidade máxima em estoque.');return}
  if(linha) linha.qtd++;
  else carrinho.push({id:id,qtd:1});
  atualizarCarrinho();
  toast(p.codigo+' adicionado!');
}

function atualizarCarrinho(){
  const count=carrinho.reduce((s,x)=>s+x.qtd,0);
  document.getElementById('count').textContent=count;
  const box=document.getElementById('cartItems');
  if(!carrinho.length) box.innerHTML='<p>Seu carrinho está vazio.</p>';
  else box.innerHTML=carrinho.map(l=>{
    const p=produtos.find(x=>x.id===l.id);
    return `<div class="cart-line"><b>${p.codigo} — ${p.jogador}</b>${l.qtd} × ${brl(p.preco)}<br><button class="remove" onclick="remover(${p.id})">remover</button></div>`;
  }).join('');
  const total=carrinho.reduce((s,l)=>{
    const p=produtos.find(x=>x.id===l.id);
    return s+p.preco*l.qtd;
  },0);
  document.getElementById('total').textContent='Total: '+brl(total);
}

function remover(id){
  carrinho=carrinho.filter(x=>x.id!==id);
  atualizarCarrinho();
}

function verCarrinho(){
  document.getElementById('drawer').classList.add('open');
  atualizarCarrinho();
}

function fecharCarrinho(){
  document.getElementById('drawer').classList.remove('open');
}

function finalizarWhatsApp(){
  if(!carrinho.length){toast('Seu carrinho está vazio.');return}
  let texto='Olá! Quero fazer este pedido:%0A%0A';
  let total=0;
  carrinho.forEach(l=>{
    const p=produtos.find(x=>x.id===l.id);
    texto+=`• ${p.codigo} — ${p.jogador} — ${l.qtd} un. — ${brl(p.preco*l.qtd)}%0A`;
    total+=p.preco*l.qtd;
  });
  texto+=`%0A*Total: ${brl(total)}*`;
  const numero='5562981595949';
  window.open('https://wa.me/'+numero+'?text='+texto,'_blank');
}

function toast(t){
  let x=document.getElementById('toast');
  x.textContent=t;
  x.style.display='block';
  setTimeout(()=>x.style.display='none',1800);
}

render();
atualizarCarrinho();
</script>
</body>
</html>
